server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API isteklerini Spring Boot container'ına yönlendir (CORS'a gerek kalmaz)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React Router: bilinmeyen yollar index.html'e düşsün (sayfa yenilemede 404 olmasın)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
