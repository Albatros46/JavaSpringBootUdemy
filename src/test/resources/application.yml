spring:
  datasource:
    url: jdbc:h2:mem:ecom_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

app:
  cors:
    allowed-origins: http://localhost:5173
